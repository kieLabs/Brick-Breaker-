<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#020711">
<meta name="description" content="BRICK BREAKER NEON – GamerKie Edition. Break every brick and master endless neon arcade levels.">
<title>BRICK BREAKER NEON – GamerKie Edition</title>
<style>
:root{color-scheme:dark;--cyan:#65efff;--blue:#43baff;--pink:#ff4acb;--purple:#bd73ff;--red:#ff526b;--gold:#ffd76a;--bg:#020711}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#01040a;font-family:Inter,system-ui,Segoe UI,Arial,sans-serif;touch-action:none;user-select:none}
body{display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 30%,#071a2c 0,#020711 52%,#000 100%)}
#shell{position:relative;width:min(100vw,56.25dvh,480px);height:100dvh;aspect-ratio:9/16;overflow:hidden;background:#020711;box-shadow:0 0 50px #00bfff22;border:1px solid #43dfff22}
canvas{display:block;width:100%;height:100%;touch-action:none}
#brand{position:absolute;top:env(safe-area-inset-top,0);left:50%;transform:translateX(-50%);font-size:9px;letter-spacing:3px;color:#6bdfff80;font-weight:800;pointer-events:none;text-shadow:0 0 10px #31cfff}
#toast{position:absolute;left:50%;top:15%;transform:translate(-50%,-10px);padding:9px 16px;border:1px solid #6beaff88;border-radius:30px;background:#061927dd;color:#dffcff;font-size:12px;letter-spacing:1px;opacity:0;transition:.2s;pointer-events:none;white-space:nowrap;box-shadow:0 0 20px #36cfff55}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media (orientation:landscape) and (max-height:520px){#shell{height:100dvh;width:min(56.25dvh,100vw);}}
</style>
</head>
<body>
<div id="shell"><canvas id="game" aria-label="Neon brick breaker game"></canvas><div id="brand">G A M E R K I E</div><div id="toast"></div></div>
<script>
(()=>{
'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d',{alpha:false}),toastEl=document.getElementById('toast');
const BASE={w:432,h:768};let W=BASE.w,H=BASE.h,dpr=1,scale=1,offsetX=0,offsetY=0;
let state='menu',level=1,score=0,best=+(localStorage.getItem('gkbn_best')||0),totalDestroyed=+(localStorage.getItem('gkbn_destroyed')||0),stars=+(localStorage.getItem('gkbn_stars')||0),coins=+(localStorage.getItem('gkbn_coins')||0),unlocked=+(localStorage.getItem('gkbn_level')||1),soundOn=localStorage.getItem('gkbn_sound')!=='off',musicOn=localStorage.getItem('gkbn_music')!=='off';
let bricks=[],balls=[],particles=[],floaters=[],drops=[],lasers=[],starsBg=[],formationName='SQUARE',volley=0,ballsRemaining=12,launcherX=W/2,aim={x:W/2,y:300},pointerDown=false,shotReady=true,shield=0,fireball=0,slowmo=0,magnet=0,scoreMulti=1,combo=0,lastHit=0,shake=0,flash=0,levelStarted=0,menuButtons=[],buttonRects=[],powerCharges={lightning:5,multi:5,laser:3,shield:2},lastTime=0,acc=0,frame=0;
const COLORS=['#61eaff','#c77aff','#ffd95c','#ff6689','#65ffc7','#65a6ff'];
const rand=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),dist=(a,b,c,d)=>Math.hypot(a-c,b-d);
function resize(){const r=canvas.getBoundingClientRect();dpr=Math.min(2,window.devicePixelRatio||1);canvas.width=Math.round(r.width*dpr);canvas.height=Math.round(r.height*dpr);scale=Math.max(r.width/W,r.height/H);offsetX=(r.width-W*scale)/2;offsetY=(r.height-H*scale)/2;ctx.setTransform(dpr*scale,0,0,dpr*scale,dpr*offsetX,dpr*offsetY)}
window.addEventListener('resize',resize);resize();
function save(){localStorage.setItem('gkbn_best',best);localStorage.setItem('gkbn_destroyed',totalDestroyed);localStorage.setItem('gkbn_stars',stars);localStorage.setItem('gkbn_coins',coins);localStorage.setItem('gkbn_level',unlocked);localStorage.setItem('gkbn_sound',soundOn?'on':'off');localStorage.setItem('gkbn_music',musicOn?'on':'off')}
function toast(t){toastEl.textContent=t;toastEl.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>toastEl.classList.remove('show'),1300)}
let audioCtx=null,musicGain=null,musicTimer=null,musicStep=0;function ensureAudio(){try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();return true}catch(e){return false}}function tone(freq=440,dur=.07,type='sine',vol=.035){if(!soundOn||!ensureAudio())return;try{let o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(vol,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+dur);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+dur)}catch(e){}}function musicTick(){if(!musicOn||!ensureAudio())return;const notes=[110,164.81,220,164.81,130.81,196,261.63,196];let o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='triangle';o.frequency.value=notes[musicStep++%notes.length];g.gain.setValueAtTime(.0001,audioCtx.currentTime);g.gain.linearRampToValueAtTime(.018,audioCtx.currentTime+.08);g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+.42);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+.44)}function startMusic(){if(!musicOn||musicTimer)return;if(!ensureAudio())return;musicTick();musicTimer=setInterval(musicTick,460)}function stopMusic(){if(musicTimer){clearInterval(musicTimer);musicTimer=null}}
function rect(x,y,w,h,r,fill,stroke,lw=1){ctx.beginPath();ctx.roundRect(x,y,w,h,r);if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.lineWidth=lw;ctx.strokeStyle=stroke;ctx.stroke()}}
function glowText(text,x,y,size,color,align='center',weight=700){ctx.save();ctx.font=`${weight} ${size}px system-ui, sans-serif`;ctx.textAlign=align;ctx.textBaseline='middle';ctx.shadowColor=color;ctx.shadowBlur=12;ctx.fillStyle=color;ctx.fillText(text,x,y);ctx.restore()}
function roundedButton(x,y,w,h,label,sub,color='#58eaff',id=label){buttonRects.push({x,y,w,h,id});ctx.save();ctx.shadowColor=color;ctx.shadowBlur=14;rect(x,y,w,h,12,'#071a2bdc',color,1.5);ctx.shadowBlur=0;glowText(label,x+w/2,y+h/2-(sub?5:0),14,color);if(sub){ctx.shadowBlur=0;ctx.fillStyle='#b5d8e9';ctx.font='9px system-ui';ctx.textAlign='center';ctx.fillText(sub,x+w/2,y+h/2+12)}ctx.restore()}
function starShape(x,y,r,rot=0){ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.beginPath();for(let i=0;i<10;i++){let a=-Math.PI/2+i*Math.PI/5,rr=i%2?r*.43:r;ctx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr)}ctx.closePath();ctx.fill();ctx.restore()}
function makeBg(){starsBg=[];for(let i=0;i<85;i++)starsBg.push({x:rand(12,W-12),y:rand(0,H),r:rand(.5,1.7),a:rand(.15,.8),p:rand(0,6.28)})}makeBg();
function formationCells(cols,rows,kind){let cells=[];for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){let nx=(c-(cols-1)/2)/Math.max(1,cols/2),ny=(r-(rows-1)/2)/Math.max(1,rows/2),on=true;
switch(kind){case'TRIANGLE':on=c>=Math.floor((cols-r-1)/2)&&c<Math.ceil((cols+r+1)/2);break;case'DIAMOND':on=Math.abs(nx)+Math.abs(ny)*.95<1.25;break;case'SPIRAL':{let ang=Math.atan2(ny,nx),rad=Math.hypot(nx,ny);on=Math.abs(Math.sin(ang*2.2+rad*7))<.42&&rad<1.05;break}case'ZIGZAG':on=(r%2===0?c%3!==2:c%3!==0);break;case'PYRAMID':on=c>=r*.55&&c<cols-r*.55;break;case'CIRCLE':on=Math.abs(Math.hypot(nx,ny)-.68)<.34;break;case'RANDOM':on=Math.random()>.33;break;case'SYMMETRIC':on=(c<2||c>=cols-2||r%2===0);break;case'COMPLEX':on=((r+c)%4!==0)&&Math.abs(nx)+Math.abs(ny)<1.65;break;default:on=(r<rows-1||c%2===0)}}return cells}
function generateLevel(n){bricks=[];balls=[];particles=[];floaters=[];drops=[];lasers=[];combo=0;volley=0;ballsRemaining=Math.min(35,12+Math.floor(n/8));launcherX=W/2;const kinds=['SQUARE','TRIANGLE','DIAMOND','SPIRAL','ZIGZAG','PYRAMID','CIRCLE','RANDOM','SYMMETRIC','COMPLEX'];formationName=kinds[(n-1)%kinds.length];let cols=10,rows=Math.min(8,2+Math.floor((n-1)/5));let cells=formationCells(cols,rows,formationName);let cellW=34,cellH=32,gap=4,totalW=cols*(cellW+gap)-gap,startX=(W-totalW)/2;let top=172;
for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){let on=cells[r*cols+c];if(!on)continue;if(Math.random()<Math.max(.05,.19-n*.0005))continue;let hp=Math.max(1,Math.round(1+n*.16+r*.4+rand(0,Math.min(2,1+n*.012))));let roll=Math.random(),type=roll<.05?'explosive':roll<.10?'gold':roll<.15?'armored':roll<.19?'rainbow':roll<.22?'multiplier':roll<.25?'laser':'normal';if(n<=3)type='normal';bricks.push({x:startX+c*(cellW+gap),y:top+r*(cellH+gap),w:cellW,h:cellH,hp,max:hp,type,color:type==='gold'?'#ffd76a':type==='explosive'?'#ff6475':type==='armored'?'#65eaff':type==='rainbow'?COLORS[Math.floor(rand(0,COLORS.length))]:type==='laser'?'#ff68d4':COLORS[(r+c+n)%COLORS.length],phase:rand(0,6.28),alive:true})}
if(bricks.length<8){for(let i=0;i<10;i++)bricks.push({x:startX+i*(cellW+gap),y:top,w:cellW,h:cellH,hp:1+Math.floor(n*.12),max:1+Math.floor(n*.12),type:'normal',color:COLORS[i%COLORS.length],phase:0,alive:true})}
levelStarted=performance.now();state='playing';shotReady=true;toast(`LEVEL ${n} • ${formationName}`);}
function startGame(){level=Math.max(1,unlocked);score=0;generateLevel(level)}
function addParticle(x,y,color,count=10,power=1){for(let i=0;i<count;i++){let a=rand(0,Math.PI*2),s=rand(.5,3.6)*power;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rand(.35,.8),max:.8,r:rand(1.2,3.2),color})}}
function floatText(x,y,text,color='#fff'){floaters.push({x,y,text,color,life:1})}
function hitBrick(b,ball){b.hp--;let now=performance.now();combo=now-lastHit<900?combo+1:1;lastHit=now;score+=10*scoreMulti*Math.min(8,combo);tone(330+b.hp*35,.045,'triangle',.025);addParticle(ball.x,ball.y,b.color,5,.7);if(b.hp<=0){b.alive=false;score+=40*scoreMulti;totalDestroyed++;coins+=1;if(Math.random()<.18)drops.push({x:b.x+b.w/2,y:b.y+b.h/2,type:'star',vy:55,phase:0});addParticle(b.x+b.w/2,b.y+b.h/2,b.color,22,1.4);floatText(b.x+b.w/2,b.y,b.type==='gold'?'+100 GOLD':'+40',b.color);if(b.type==='explosive')areaDamage(b);if(b.type==='multiplier'){scoreMulti=Math.min(5,scoreMulti+1);floatText(b.x,b.y-8,'MULTI x'+scoreMulti,'#ff7ad9')}if(b.type==='gold'){score+=100;coins+=5}if(b.type==='laser'){lasers.push({x:b.x+b.w/2,y:170,life:.5})}}
if(combo>2)floatText(ball.x,ball.y-15,`COMBO x${Math.min(combo,8)}`,'#7df7ff');if(score>best){best=score;save()}save();}
function areaDamage(b){shake=9;flash=.3;for(let o of bricks){if(o!==b&&o.alive&&dist(o.x+o.w/2,o.y+o.h/2,b.x+b.w/2,b.y+b.h/2)<95){o.hp-=2;if(o.hp<=0){o.alive=false;totalDestroyed++;score+=40;addParticle(o.x+o.w/2,o.y+o.h/2,o.color,15,1)}}}addParticle(b.x+b.w/2,b.y+b.h/2,'#ff526b',35,2);tone(90,.3,'sawtooth',.07)}
function shoot(){if(state!=='playing'||!shotReady||balls.length)return;let dx=aim.x-launcherX,dy=aim.y-690;if(dy> -90)dy=-Math.abs(dy||1);let ang=Math.atan2(dy,dx);ang=clamp(ang,-Math.PI+.23,-.23);let speed=330;for(let i=0;i<ballsRemaining;i++){let spread=(i-(ballsRemaining-1)/2)*.013;let a=ang+spread;balls.push({x:launcherX,y:690,vx:Math.cos(a)*speed,vy:Math.sin(a)*speed,r:4.2,trail:[],fire:fireball>0,alive:true,phase:rand(0,6.28)})}shotReady=false;pointerDown=false;tone(650,.09,'triangle',.05);}
function activatePower(id){if(state!=='playing')return;if((powerCharges[id]||0)<=0){toast('NO CHARGES LEFT');return}powerCharges[id]--;save();if(id==='lightning'){let targets=bricks.filter(b=>b.alive).sort(()=>Math.random()-.5).slice(0,Math.min(9,bricks.length));targets.forEach((b,i)=>{setTimeout(()=>{if(!b.alive)return;b.hp-=Math.max(2,Math.ceil(level*.15));addParticle(b.x+b.w/2,b.y+b.h/2,'#e9fbff',18,1.6);lasers.push({x:b.x+b.w/2,y:165,life:.45});if(b.hp<=0){b.alive=false;score+=60;totalDestroyed++}tone(900,.07,'square',.03)},i*55)});shake=6;toast('LIGHTNING STRIKE!');}
else if(id==='multi'){ballsRemaining=Math.min(45,ballsRemaining+8);toast('+8 EXTRA BALLS');addParticle(launcherX,690,'#ff67d5',28,1.3)}
else if(id==='laser'){for(let i=0;i<5;i++){let x=70+i*73;lasers.push({x,y:160,life:.75});bricks.forEach(b=>{if(b.alive&&x>b.x-5&&x<b.x+b.w+5){b.hp-=3;if(b.hp<=0){b.alive=false;score+=50;totalDestroyed++}}})}shake=5;toast('LASER BARRAGE!')}
else if(id==='shield'){shield=8;toast('SHIELD ACTIVATED')}
}
function moveBrickWave(){let down=29;for(let b of bricks)b.y+=down;let n=level,cols=10,cellW=34,cellH=32,gap=4,startX=(W-(cols*38-4))/2;let row=[];for(let c=0;c<cols;c++){if(Math.random()<.16)continue;let hp=Math.max(1,Math.round(1+n*.15+rand(0,2)));row.push({x:startX+c*38,y:172,w:cellW,h:cellH,hp,max:hp,type:Math.random()<.12?'armored':'normal',color:COLORS[(c+volley)%COLORS.length],phase:rand(0,6.28),alive:true})}bricks.push(...row);if(bricks.some(b=>b.y+b.h>=666)){if(shield>0){shield=0;bricks.forEach(b=>b.y-=40);toast('SHIELD SAVED YOU')}else{state='gameover';tone(110,.5,'sawtooth',.06)}}}
function nextVolley(){balls=[];if(state!=='playing')return;volley++;moveBrickWave();launcherX=clamp(launcherX,65,W-65);ballsRemaining=Math.max(1,ballsRemaining);shotReady=true;if(!bricks.some(b=>b.alive)){completeLevel();return}if(state==='playing')toast('AIM • RELEASE TO SHOOT')}
function completeLevel(){state='complete';let reward=100+level*12;score+=reward;coins+=Math.ceil(reward/20);stars+=3;unlocked=Math.max(unlocked,level+1);best=Math.max(best,score);save();tone(880,.22,'sine',.06);setTimeout(()=>tone(1175,.26,'sine',.06),140)}
function update(dt){frame++;let time=dt*(slowmo>0?.52:1);slowmo=Math.max(0,slowmo-dt);fireball=Math.max(0,fireball-dt);shield=Math.max(0,shield-dt);magnet=Math.max(0,magnet-dt);if(shake>0)shake=Math.max(0,shake-dt*22);if(flash>0)flash=Math.max(0,flash-dt);
for(let s of starsBg)s.p+=dt*1.2;
for(let b of bricks){b.phase+=dt*2;if(b.type==='rainbow')b.color=COLORS[Math.floor((frame/18+b.phase)%COLORS.length)]}
for(let b of balls){if(!b.alive)continue;b.trail.unshift({x:b.x,y:b.y});if(b.trail.length>9)b.trail.pop();let nx=b.x+b.vx*time,ny=b.y+b.vy*time;if(nx<b.r+34){nx=b.r+34;b.vx=Math.abs(b.vx)}if(nx>W-34-b.r){nx=W-34-b.r;b.vx=-Math.abs(b.vx)}if(ny<160+b.r){ny=160+b.r;b.vy=Math.abs(b.vy)}
let hit=null;for(let br of bricks){if(!br.alive)continue;if(nx+ b.r>br.x&&nx-b.r<br.x+br.w&&ny+b.r>br.y&&ny-b.r<br.y+br.h){hit=br;break}}
if(hit){let prevX=b.x,prevY=b.y;let overlapX=Math.min(nx+b.r-hit.x,hit.x+hit.w-(nx-b.r)),overlapY=Math.min(ny+b.r-hit.y,hit.y+hit.h-(ny-b.r));if(overlapX<overlapY)b.vx=prevX<hit.x? -Math.abs(b.vx):Math.abs(b.vx);else b.vy=prevY<hit.y?-Math.abs(b.vy):Math.abs(b.vy);hitBrick(hit,b);if(b.fire){hit.hp-=1;if(hit.hp<=0&&hit.alive){hit.alive=false;score+=50;totalDestroyed++}}ny=b.y+b.vy*time;nx=b.x+b.vx*time;}
b.x=nx;b.y=ny;if(b.y>735)b.alive=false;}
balls=balls.filter(b=>b.alive);
for(let p of particles){p.x+=p.vx*time*60;p.y+=p.vy*time*60;p.vx*=.985;p.vy*=.985;p.life-=dt}
particles=particles.filter(p=>p.life>0);
for(let f of floaters){f.y-=25*dt;f.life-=dt}floaters=floaters.filter(f=>f.life>0);
for(let d of drops){d.y+=d.vy*dt;d.phase+=dt*4;if(magnet>0){d.x+=(launcherX-d.x)*dt*1.8;d.y+=(690-d.y)*dt*1.2}if(d.y>660){d.gone=true;stars++;coins++;save();floatText(d.x,d.y,'+1 STAR','#ff82ed')}}drops=drops.filter(d=>!d.gone);
for(let l of lasers)l.life-=dt;lasers=lasers.filter(l=>l.life>0);
if(state==='playing'&&!shotReady&&balls.length===0){nextVolley()}
if(bricks.length&&!bricks.some(b=>b.alive)&&state==='playing')completeLevel();
}
function drawBackground(){let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#061a2b');g.addColorStop(.25,'#020b16');g.addColorStop(1,'#02040b');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);let rg=ctx.createRadialGradient(W/2,250,10,W/2,300,420);rg.addColorStop(0,'#0b385055');rg.addColorStop(1,'#00000000');ctx.fillStyle=rg;ctx.fillRect(0,0,W,H);for(let s of starsBg){ctx.globalAlpha=s.a*(.65+.35*Math.sin(s.p));ctx.fillStyle='#baf7ff';ctx.fillRect(s.x,s.y,s.r,s.r)}ctx.globalAlpha=1;}
function drawFrame(){ctx.save();if(shake>0)ctx.translate(rand(-shake,shake),rand(-shake,shake));let x=31,y=148,w=W-62,h=526;ctx.save();ctx.shadowColor='#40dfff';ctx.shadowBlur=15;rect(x,y,w,h,5,'#02091488','#63dfff99',2);ctx.restore();ctx.save();ctx.shadowColor='#d56cff';ctx.shadowBlur=14;ctx.strokeStyle='#c86dff66';ctx.lineWidth=1;ctx.strokeRect(x+4,y+4,w-8,h-8);ctx.restore();
// top HUD
ctx.fillStyle='#dffaff';ctx.font='bold 11px system-ui';ctx.textAlign='left';ctx.fillText('LVL '+level,34,36);ctx.textAlign='center';ctx.font='10px system-ui';ctx.fillStyle='#98cfe0';ctx.fillText(score.toString(),W/2,36);ctx.textAlign='right';ctx.fillText('BEST '+best,W-34,36);
// progress strip
rect(96,51,240,4,3,'#0b2436','#315c6d',.6);let prog=bricks.length?1-bricks.filter(b=>b.alive).length/Math.max(1,bricks.length):0;rect(96,51,240*prog,4,3,'#61eaff');for(let i=0;i<3;i++){ctx.fillStyle=prog>(i+1)/3?'#fff':'#3e7890';ctx.beginPath();ctx.arc(105+i*110,53,2.4,0,Math.PI*2);ctx.fill()}
// circular top controls
circleButton(31,68,'◉','#66eaff','menu');circleButton(W-31,68,'Ⅱ','#66eaff','pause');
// brick area
for(let b of bricks)if(b.alive)drawBrick(b);
// danger line
ctx.save();ctx.setLineDash([6,7]);ctx.strokeStyle='#ff507a55';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(33,666);ctx.lineTo(W-33,666);ctx.stroke();ctx.restore();
// collectible stars
for(let d of drops){ctx.save();ctx.shadowColor='#ff73e8';ctx.shadowBlur=16;ctx.fillStyle='#ffd8ff';starShape(d.x,d.y,7,d.phase);ctx.restore()}
// laser beams
for(let l of lasers){ctx.save();ctx.globalAlpha=clamp(l.life*2,0,1);ctx.shadowColor='#70ffff';ctx.shadowBlur=22;let gr=ctx.createLinearGradient(l.x-9,0,l.x+9,0);gr.addColorStop(0,'#35dfff00');gr.addColorStop(.5,'#dfffff');gr.addColorStop(1,'#35dfff00');ctx.fillStyle=gr;ctx.fillRect(l.x-7,160,14,510);ctx.restore()}
// balls and trails
for(let b of balls){for(let i=b.trail.length-1;i>=0;i--){let t=b.trail[i],a=(1-i/b.trail.length)*.28;ctx.globalAlpha=a;ctx.fillStyle=b.fire?'#ff9a48':'#9beeff';ctx.beginPath();ctx.arc(t.x,t.y,b.r*(1-i/b.trail.length)*1.3,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;ctx.save();ctx.shadowColor=b.fire?'#ff762e':'#6beeff';ctx.shadowBlur=18;let grad=ctx.createRadialGradient(b.x-1,b.y-1,0,b.x,b.y,b.r*2.5);grad.addColorStop(0,'#fff');grad.addColorStop(.35,b.fire?'#ffb55e':'#c8fbff');grad.addColorStop(1,b.fire?'#ff5a18':'#37bfff');ctx.fillStyle=grad;ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill();ctx.restore()}
// aim guide
if(shotReady&&state==='playing'){let dx=aim.x-launcherX,dy=aim.y-690,ang=Math.atan2(dy,dx);if(dy>-90)ang=-Math.PI/2;ang=clamp(ang,-Math.PI+.22,-.22);ctx.save();ctx.setLineDash([3,7]);ctx.strokeStyle='#b5f8ff77';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(launcherX,690);ctx.lineTo(launcherX+Math.cos(ang)*165,690+Math.sin(ang)*165);ctx.stroke();ctx.restore()}
// launcher glow and arrow
ctx.save();ctx.shadowColor='#ff536b';ctx.shadowBlur=18;rect(launcherX-20,683,40,23,8,'#220c1a','#ff6f82',1.5);ctx.restore();ctx.save();ctx.translate(launcherX,694);ctx.fillStyle='#fff';ctx.shadowColor='#ff5c78';ctx.shadowBlur=12;ctx.beginPath();ctx.arc(0,-7,4.5,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#ff93a4';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,-1);ctx.lineTo(0,8);ctx.lineTo(-5,3);ctx.moveTo(0,8);ctx.lineTo(5,3);ctx.stroke();ctx.restore();
// particle explosions
for(let p of particles){ctx.save();ctx.globalAlpha=clamp(p.life*1.8,0,1);ctx.fillStyle=p.color;ctx.shadowColor=p.color;ctx.shadowBlur=9;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();ctx.restore()}
for(let f of floaters){ctx.save();ctx.globalAlpha=clamp(f.life,0,1);glowText(f.text,f.x,f.y,11,f.color);ctx.restore()}
// bottom tray
ctx.save();let tray=ctx.createLinearGradient(0,680,0,H);tray.addColorStop(0,'#070d1be8');tray.addColorStop(1,'#100920f2');ctx.fillStyle=tray;ctx.fillRect(0,716,W,H-716);ctx.strokeStyle='#c36bff88';ctx.shadowColor='#d266ff';ctx.shadowBlur=12;ctx.beginPath();ctx.moveTo(0,716);ctx.lineTo(W,716);ctx.stroke();ctx.restore();
// action controls
powerButton(48,741,'ϟ',powerCharges.lightning,'#ff6681','lightning');powerButton(384,741,'●',powerCharges.multi,'#ff6681','multi');powerButton(148,741,'LASER',powerCharges.laser,'#6cefff','laser');powerButton(284,741,'SHIELD',powerCharges.shield,'#c67aff','shield');
ctx.fillStyle='#d6f9ff';ctx.font='bold 10px system-ui';ctx.textAlign='center';ctx.fillText('BALLS  × '+(ballsRemaining+(balls.length?0:0)),W/2,729);
if(shield>0){ctx.strokeStyle='#8efaffaa';ctx.lineWidth=3;ctx.shadowColor='#55eeff';ctx.shadowBlur=18;ctx.beginPath();ctx.arc(launcherX,690,31,Math.PI,Math.PI*2);ctx.stroke();ctx.shadowBlur=0}
if(flash>0){ctx.fillStyle=`rgba(140,245,255,${flash*.35})`;ctx.fillRect(0,0,W,H)}ctx.restore();}
function drawBrick(b){let c=b.color;ctx.save();ctx.shadowColor=c;ctx.shadowBlur=10;let g=ctx.createLinearGradient(b.x,b.y,b.x+b.w,b.y+b.h);g.addColorStop(0,c+'44');g.addColorStop(.5,'#ffffff10');g.addColorStop(1,c+'33');rect(b.x,b.y,b.w,b.h,5,g,c,1.3);ctx.shadowBlur=0;ctx.strokeStyle='#ffffff55';ctx.lineWidth=.7;ctx.beginPath();ctx.moveTo(b.x+5,b.y+2);ctx.lineTo(b.x+b.w-5,b.y+2);ctx.stroke();if(b.type==='armored'){ctx.strokeStyle='#fff8';ctx.strokeRect(b.x+4,b.y+4,b.w-8,b.h-8)}if(b.type==='explosive'){ctx.fillStyle='#ffb1bd';ctx.font='8px system-ui';ctx.fillText('✦',b.x+5,b.y+10)}if(b.type==='gold'){ctx.fillStyle='#fff4bc';ctx.font='7px system-ui';ctx.fillText('★',b.x+b.w-9,b.y+9)}if(b.type==='laser'){ctx.fillStyle='#ffe6ff';ctx.font='7px system-ui';ctx.fillText('ϟ',b.x+b.w-9,b.y+9)}ctx.fillStyle='#f4fcff';ctx.font='bold 9px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.shadowColor=c;ctx.shadowBlur=6;ctx.fillText(b.hp,b.x+b.w/2,b.y+b.h/2+.5);ctx.restore()}
function circleButton(x,y,label,color,id){ctx.save();ctx.shadowColor=color;ctx.shadowBlur=13;ctx.strokeStyle=color;ctx.lineWidth=2;ctx.beginPath();ctx.arc(x,y,13,0,Math.PI*2);ctx.stroke();ctx.shadowBlur=0;glowText(label,x,y,13,color);ctx.restore();buttonRects.push({x:x-17,y:y-17,w:34,h:34,id})}
function powerButton(x,y,label,count,color,id){ctx.save();ctx.shadowColor=color;ctx.shadowBlur=14;ctx.strokeStyle=color;ctx.lineWidth=1.6;ctx.beginPath();ctx.arc(x,y,20,0,Math.PI*2);ctx.stroke();ctx.fillStyle='#100d1b';ctx.beginPath();ctx.arc(x,y,16,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;glowText(label,x,y-1,label.length>3?7:17,color);ctx.fillStyle='#f4ecff';ctx.font='8px system-ui';ctx.textAlign='center';ctx.fillText('×'+count,x,y+29);ctx.restore();buttonRects.push({x:x-24,y:y-25,w:48,h:52,id:'power:'+id})}
function panel(title,subtitle){ctx.fillStyle='#01050bdc';ctx.fillRect(0,0,W,H);let g=ctx.createLinearGradient(0,220,W,550);g.addColorStop(0,'#0a2943');g.addColorStop(1,'#190a2d');ctx.save();ctx.shadowColor='#57eaff';ctx.shadowBlur=24;rect(32,215,W-64,335,20,'#061524eF','#54eaff99',1.5);ctx.restore();glowText(title,W/2,270,24,'#dbfaff');ctx.fillStyle='#b7d5e5';ctx.font='12px system-ui';ctx.textAlign='center';ctx.fillText(subtitle,W/2,302)}
function drawMenu(){drawBackground();drawFrameBase();glowText('BRICK BREAKER',W/2,235,25,'#e8fbff');glowText('NEON',W/2,273,42,'#63eaff');glowText('G A M E R K I E   E D I T I O N',W/2,309,9,'#c58aff');ctx.fillStyle='#98bdce';ctx.font='11px system-ui';ctx.textAlign='center';ctx.fillText('BREAK EVERY BRICK. MASTER EVERY LEVEL.',W/2,352);let y=410;roundedButton(86,y,260,52,'▶  PLAY GAME','CONTINUE YOUR JOURNEY','#5cecff','play');roundedButton(86,y+69,124,43,'LEVELS','UNLOCKED '+unlocked,'#c57dff','levels');roundedButton(222,y+69,124,43,'HOW TO PLAY','CONTROLS & POWERS','#ff72d4','help');roundedButton(86,y+126,124,43,'SETTINGS','SOUND & MUSIC','#ffd46c','settings');roundedButton(222,y+126,124,43,'REWARDS','SCORES & STARS','#69ffc9','scores');glowText('BEST  '+best+'     ★  '+stars+'     COINS  '+coins,W/2,637,11,'#a8eaff');}
function drawFrameBase(){ctx.save();ctx.shadowColor='#42eaff';ctx.shadowBlur=18;rect(20,18,W-40,H-36,12,'#020914','#4adfff66',1.4);ctx.restore();for(let s of starsBg){ctx.globalAlpha=s.a;ctx.fillStyle='#c7faff';ctx.fillRect(s.x,s.y,s.r,s.r)}ctx.globalAlpha=1;}
function drawPause(){drawFrame();panel('PAUSED','Take a breath. Your level is waiting.');roundedButton(95,350,242,48,'▶  RESUME','','#61efff','resume');roundedButton(95,411,242,45,'RESTART LEVEL','','#ffcb6a','restart');roundedButton(95,469,242,45,'MAIN MENU','','#d17cff','menu');}
function drawComplete(){drawFrame();panel('LEVEL COMPLETE!','A new challenge is ready for you.');glowText('★  +3 STARS     +'+(100+level*12)+' POINTS',W/2,337,14,'#ffe27a');glowText('LEVEL '+level+' CLEARED',W/2,378,12,'#bfeeff');roundedButton(95,420,242,50,'NEXT LEVEL  ▶','','#62f5ff','next');roundedButton(95,483,242,42,'MAIN MENU','','#c87aff','menu');}
function drawGameOver(){drawFrame();panel('DANGER ZONE!','The bricks crossed the danger line.');glowText('SCORE  '+score,W/2,345,15,'#ff91a6');glowText('BEST  '+best,W/2,377,12,'#c4eeff');roundedButton(95,420,242,49,'TRY AGAIN','','#67eeff','retry');roundedButton(95,482,242,43,'MAIN MENU','','#d17cff','menu');}
function drawHelp(){drawBackground();drawFrameBase();panel('HOW TO PLAY','Simple controls. Endless neon challenges.');let lines=['1. DRAG to aim your launcher.','2. RELEASE to fire the ball volley.','3. Hit numbered bricks to reduce HP.','4. Collect falling stars for rewards.','5. Use ϟ Lightning, Multi-ball, Laser & Shield.','6. Clear bricks before they reach the red line.'];ctx.textAlign='left';ctx.font='11px system-ui';ctx.fillStyle='#c6e9f4';lines.forEach((t,i)=>ctx.fillText(t,62,347+i*28));roundedButton(95,530,242,45,'BACK','','#64eaff','back')}
function drawSettings(){drawBackground();drawFrameBase();panel('SETTINGS','Choose your arcade experience.');roundedButton(95,350,242,47,'SOUND  '+(soundOn?'ON':'OFF'),'GAME EFFECTS','#69eaff','sound');roundedButton(95,413,242,47,'MUSIC  '+(musicOn?'ON':'OFF'),'BACKGROUND MUSIC','#d17cff','music');roundedButton(95,488,242,45,'BACK','','#ffce65','back')}
function drawLevels(){drawBackground();drawFrameBase();panel('LEVEL SELECT','Your journey has no final level.');glowText('UNLOCKED THROUGH  '+unlocked,W/2,342,13,'#70eeff');ctx.fillStyle='#b7e8f4';ctx.font='11px system-ui';ctx.textAlign='center';ctx.fillText('Current progress is saved automatically.',W/2,380);roundedButton(95,422,242,45,'PLAY LEVEL '+unlocked,'ENDLESS PROCEDURAL MODE','#63eaff','play');roundedButton(95,483,242,45,'BACK','','#d17cff','back')}
function drawScores(){drawBackground();drawFrameBase();panel('ARCADE RECORDS','Your saved achievements.');glowText('BEST SCORE  '+best,W/2,344,16,'#68efff');glowText('BRICKS DESTROYED  '+totalDestroyed,W/2,382,13,'#d58bff');glowText('STARS  '+stars+'     COINS  '+coins,W/2,420,13,'#ffdf78');roundedButton(95,484,242,45,'BACK','','#66eaff','back')}
function draw(){ctx.save();ctx.setTransform(dpr*scale,0,0,dpr*scale,dpr*offsetX,dpr*offsetY);buttonRects=[];if(state==='menu')drawMenu();else if(state==='playing') {drawBackground();drawFrame()}else if(state==='paused')drawPause();else if(state==='complete')drawComplete();else if(state==='gameover')drawGameOver();else if(state==='help')drawHelp();else if(state==='settings')drawSettings();else if(state==='levels')drawLevels();else if(state==='scores')drawScores();ctx.restore()}
function point(e){let r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left-offsetX)/scale,y:(e.clientY-r.top-offsetY)/scale}}
function hitButton(p){for(let i=buttonRects.length-1;i>=0;i--){let b=buttonRects[i];if(p.x>=b.x&&p.x<=b.x+b.w&&p.y>=b.y&&p.y<=b.y+b.h)return b.id}return null}
function handleButton(id){if(!id)return;if(id.startsWith('power:')){activatePower(id.split(':')[1]);return}switch(id){case'play':startGame();break;case'pause':if(state==='playing')state='paused';break;case'resume':state='playing';break;case'restart':generateLevel(level);break;case'retry':generateLevel(level);break;case'next':level++;generateLevel(level);break;case'menu':state='menu';break;case'help':state='help';break;case'settings':state='settings';break;case'levels':state='levels';break;case'scores':state='scores';break;case'back':state='menu';break;case'sound':soundOn=!soundOn;save();break;case'music':musicOn=!musicOn;if(musicOn)startMusic();else stopMusic();save();break}}
function onDown(e){e.preventDefault();let p=point(e);if(state!=='playing'){handleButton(hitButton(p));return}let id=hitButton(p);if(id){handleButton(id);return}if(p.y>715){if(p.x<90)activatePower('lightning');else if(p.x>340)activatePower('multi');else if(p.x<210)activatePower('laser');else activatePower('shield');return}pointerDown=true;aim=p;}
function onMove(e){if(state!=='playing')return;let p=point(e);if(pointerDown||p.y<715){aim={x:clamp(p.x,35,W-35),y:clamp(p.y,170,680)}}}
function onUp(e){if(state!=='playing')return;if(pointerDown){let p=point(e);aim={x:clamp(p.x,35,W-35),y:clamp(p.y,170,680)};pointerDown=false;shoot()} }
canvas.addEventListener('pointerdown',onDown,{passive:false});canvas.addEventListener('pointermove',onMove,{passive:false});canvas.addEventListener('pointerup',onUp,{passive:false});canvas.addEventListener('pointercancel',()=>{pointerDown=false});
window.addEventListener('keydown',e=>{if(e.key==='Escape'||e.key==='p'){if(state==='playing')state='paused';else if(state==='paused')state='playing'}if(e.code==='Space'&&state==='playing')shoot();if(e.key.toLowerCase()==='l')activatePower('lightning');if(e.key.toLowerCase()==='m')activatePower('multi');if(e.key.toLowerCase()==='k')activatePower('laser');if(e.key.toLowerCase()==='s')activatePower('shield')});
let fpsT=0;function loop(t){let dt=Math.min(.033,(t-lastTime)/1000||0);lastTime=t;if(state==='playing')update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
// Mobile browser audio unlock and save preferences.
window.addEventListener('pointerdown',()=>{if(ensureAudio()&&musicOn)startMusic()},{once:false});window.addEventListener('pagehide',()=>{save();stopMusic()});window.addEventListener('contextmenu',e=>e.preventDefault());
})();
</script>
